site_name: Asia Electronics Documentation
site_description: Technical documentation for the Asia Electronics & Cellular platform.
site_url: https://asiaelectronics.github.io/asia-electronics/
repo_name: asiaelectronics/asia-electronics
repo_url: https://github.com/asiaelectronics/asia-electronics
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables

plugins:
  - search

nav:
  - Overview / Home: index.md
  - Architecture: architecture.md
  - API & Module Reference: api.md
